<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Edwige et Florence EL-ÉNERGIE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Helvetica, Arial; background: #f5f5f5; }
        
        /* Couleurs dynamiques */
        :root {
            --color-primary: #0F4761;
            --color-accent: #F37322;
        }
        
        body.florence-mode {
            --color-primary: #8b5a8e;
            --color-accent: #d4a5d4;
        }
        
        .container { display: flex; height: 100vh; }
        .sidebar { width: 250px; background: var(--color-primary); color: white; padding: 20px; overflow-y: auto; }
        .sidebar h1 { font-size: 16px; margin-bottom: 30px; }
        .sidebar h2 { margin: 20px 0 10px; font-size: 12px; text-transform: uppercase; color: #aaa; }
        .sidebar button { width: 100%; padding: 10px; margin: 5px 0; background: white; color: var(--color-primary); border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .sidebar button.active { background: var(--color-accent); }
        .main { flex: 1; display: flex; flex-direction: column; }
        .header { background: var(--color-primary); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; }
        .header-actions button { background: var(--color-accent); color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px; font-weight: 600; font-size: 12px; }
        .header-actions select { background: var(--color-accent); color: white; padding: 8px 12px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; }
        .content { flex: 1; overflow: auto; padding: 20px; }
        .view { display: none; }
        .view.active { display: block; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; }
        th { background: var(--color-primary); color: white; padding: 12px; text-align: left; font-size: 13px; font-weight: 600; }
        td { padding: 12px; border-bottom: 1px solid #ddd; font-size: 13px; }
        tr:hover { background: #f9f9f9; }
        .btn-edit { background: var(--color-accent); color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; }
        .btn-delete { background: #d32f2f; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; margin-left: 5px; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-content h2 { color: var(--color-primary); margin-bottom: 20px; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--color-primary); font-size: 13px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; font-family: Helvetica, Arial; }
        .modal-footer { margin-top: 20px; text-align: right; }
        .modal-footer button { padding: 10px 20px; margin-left: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .button-cancel { background: #ccc; color: #333; }
        .button-save { background: var(--color-accent); color: white; }
        h2 { color: var(--color-primary); margin-bottom: 15px; font-size: 18px; }
        .statut-badge { display: inline-block; padding: 4px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
        .statut-prospect { background: #e8f4f8; color: var(--color-primary); }
        .statut-encours { background: #fff3e0; color: var(--color-accent); }
        .statut-facture { background: #e8f5e9; color: #2e7d32; }
        .statut-paye { background: #f3e5f5; color: #6a1b9a; }
        .statut-termine { background: #e0f2f1; color: #00695c; }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h1>EL-ÉNERGIE</h1>
        <h2>MES CLIENTS</h2>
        <button class="nav-btn active" onclick="switchView('dashboard')">📊 Dashboard</button>
        <button class="nav-btn" onclick="switchView('bilans')">📋 Bilans</button>
        <button class="nav-btn" onclick="switchView('formations')">🎓 Formations</button>
        <button class="nav-btn" onclick="switchView('animations')">🎤 Animations</button>
        <button class="nav-btn" onclick="switchView('seminaires')">🎯 Séminaires</button>
    </div>

    <div class="main">
        <div class="header">
            <h1>EL-ÉNERGIE CRM</h1>
            <div class="header-actions">
                <select id="userSelector" onchange="switchUser()" style="padding: 8px 12px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer;">
                    <option value="Edwige">👤 Edwige</option>
                    <option value="Florence">👤 Florence</option>
                </select>
                <button onclick="showAddClientModal()">+ Ajouter Client</button>
                <button onclick="exportData()">📥 Export JSON</button>
                <button onclick="triggerImport()">📤 Import JSON</button>
            </div>
            <input type="file" id="importFile" style="display: none;" onchange="importData(event)">
        </div>
        <div class="content">
            <div id="dashboard" class="view active">
                <h2>Tableau Bord</h2>
                <div id="dashboardContent"></div>
            </div>

            <div id="bilans" class="view">
                <h2>Bilans de Compétences</h2>
                <div id="bilansTable"></div>
            </div>

            <div id="formations" class="view">
                <h2>Formations</h2>
                <div id="formationsTable"></div>
            </div>

            <div id="animations" class="view">
                <h2>Animations</h2>
                <div id="animationsTable"></div>
            </div>

            <div id="seminaires" class="view">
                <h2>Séminaires</h2>
                <div id="seminairesTable"></div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL AJOUTER/MODIFIER -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Ajouter Client</h2>
        
        <div class="form-group">
            <label>Nom Client</label>
            <input type="text" id="editClientName">
        </div>
        
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="editEmail">
        </div>
        
        <div class="form-group">
            <label>Téléphone</label>
            <input type="text" id="editTelephone">
        </div>

        <div class="form-group">
            <label>Entreprise</label>
            <input type="text" id="editEntreprise">
        </div>
        
        <div class="form-group">
            <label>Type Prestation</label>
            <input type="text" id="editPrestationType">
        </div>
        
        <div class="form-group">
            <label>Montant TTC (€)</label>
            <input type="number" id="editMontantTTC">
        </div>
        
        <div class="form-group">
            <label>Statut</label>
            <select id="editStatut">
                <option value="Prospect">Prospect</option>
                <option value="En cours">En cours</option>
                <option value="Facturé">Facturé</option>
                <option value="Payé">Payé</option>
                <option value="Terminé">Terminé</option>
            </select>
        </div>

        <div class="form-group">
            <label>Contact 2 (Nom)</label>
            <input type="text" id="editContact2">
        </div>

        <div class="form-group">
            <label>Email 2</label>
            <input type="email" id="editEmail2">
        </div>

        <div class="form-group">
            <label>Téléphone 2</label>
            <input type="text" id="editTelephone2">
        </div>
        
        <div class="form-group">
            <label>Notes</label>
            <textarea id="editNotes" rows="3"></textarea>
        </div>
        
        <div class="modal-footer">
            <button class="button-cancel" onclick="closeModal()">Annuler</button>
            <button class="button-save" onclick="saveRecord()">Enregistrer</button>
        </div>
    </div>
</div>

<script>
let data = {
    bilans: [
        { id: 1, clientName: 'Clémence Bach', email: '', telephone: '', contact2: '', email2: '', telephone2: '', entreprise: '', prestationType: 'Premium', montantTTC: 1920, statut: 'En cours', notes: '', type: 'bilan', documents: {}, utilisateur: 'Edwige' },
        { id: 2, clientName: 'Schéhérazade Bencherif', email: '06 34 25 22 32', telephone: '06 34 25 22 32', contact2: '', email2: '', telephone2: '', entreprise: '', prestationType: 'Premium', montantTTC: 1850, statut: 'En cours', notes: '', type: 'bilan', documents: {}, utilisateur: 'Edwige' },
        { id: 3, clientName: 'Thomas Surier', email: 'Thomas.surier@gmail.com', telephone: '+33 6 85 85 47 55', contact2: '', email2: '', telephone2: '', entreprise: 'Salarié - Contrôle pièces/radioprotection', prestationType: 'Premium', montantTTC: 1850, statut: 'En cours', notes: '6 RDV de 2h en distanciel', type: 'bilan', documents: {}, utilisateur: 'Edwige' }
    ],
    formations: [
        { id: 1, clientName: 'PML - GDI', email: '', telephone: '', contact2: 'Laura Mercurio', email2: '', telephone2: '', entreprise: 'Provence-Métropole Logement', prestationType: 'GDI - Chargés relations clientèle', montantTTC: 3000, statut: 'Prospect', notes: 'Contact: Laura Mercurio, Adrien Ben Oliel', type: 'formation', documents: {}, utilisateur: 'Edwige' },
        { id: 2, clientName: 'PML - QVCT', email: '', telephone: '', contact2: '', email2: '', telephone2: '', entreprise: 'Provence-Métropole Logement', prestationType: 'QVCT - 280 collaborateurs', montantTTC: 5400, statut: 'Facturé', notes: 'Semaine complète vidéos 30min', type: 'formation', documents: {}, utilisateur: 'Edwige' },
        { id: 3, clientName: 'Légimétrie - Jessica & Niazid', email: '', telephone: '', contact2: '', email2: '', telephone2: '', entreprise: 'Légimétrie/Dwell', prestationType: 'Formation Vente', montantTTC: 2900, statut: 'Facturé', notes: '4 jours juin 2026', type: 'formation', documents: {}, utilisateur: 'Edwige' }
    ],
    animations: [
        { id: 1, clientName: 'FNAIM', email: '', telephone: '', contact2: '', email2: '', telephone2: '', entreprise: 'FNAIM', prestationType: 'Animation Séminaire', montantTTC: 300, statut: 'Facturé', notes: '', type: 'animation', documents: {}, utilisateur: 'Edwige' }
    ],
    seminaires: []
};

let currentUser = 'Edwige';

let editingRecord = null;
let editingType = null;

function loadData() {
    const saved = localStorage.getItem('crm-data-complet');
    if (saved) {
        data = JSON.parse(saved);
    }
    const savedUser = localStorage.getItem('crm-current-user');
    if (savedUser) {
        currentUser = savedUser;
        document.getElementById('userSelector').value = currentUser;
    }
}

function switchUser() {
    currentUser = document.getElementById('userSelector').value;
    localStorage.setItem('crm-current-user', currentUser);
    applyUserColors();
}

function applyUserColors() {
    const body = document.body;
    if (currentUser === 'Florence') {
        body.classList.add('florence-mode');
    } else {
        body.classList.remove('florence-mode');
    }
}

function saveData() {
    localStorage.setItem('crm-data-complet', JSON.stringify(data));
}

function switchView(view) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById(view).classList.add('active');
    event.target.classList.add('active');
    
    if (view === 'dashboard') renderDashboard();
    if (view === 'bilans') renderTable('bilans');
    if (view === 'formations') renderTable('formations');
    if (view === 'animations') renderTable('animations');
}

function renderDashboard() {
    const allClients = [...data.bilans, ...data.formations, ...data.animations].filter(c => !c.utilisateur || c.utilisateur === currentUser);
    const totalCA = allClients.reduce((sum, c) => sum + c.montantTTC, 0);
    const encours = allClients.filter(c => c.statut === 'En cours').length;
    const facture = allClients.filter(c => c.statut === 'Facturé').length;
    const paye = allClients.filter(c => c.statut === 'Payé').length;
    const bilansCount = data.bilans.filter(b => !b.utilisateur || b.utilisateur === currentUser).length;
    const formationsCount = data.formations.filter(f => !f.utilisateur || f.utilisateur === currentUser).length;
    const animationsCount = data.animations.filter(a => !a.utilisateur || a.utilisateur === currentUser).length;
    
    const html = `
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;">
            <div style="background: white; padding: 20px; border-radius: 8px; border-left: 4px solid #F37322;">
                <div style="color: #999; font-size: 12px; text-transform: uppercase; margin-bottom: 10px;">CA Total</div>
                <div style="font-size: 28px; font-weight: 600; color: #0F4761;">${totalCA}€</div>
            </div>
            <div style="background: white; padding: 20px; border-radius: 8px; border-left: 4px solid var(--color-accent);">
                <div style="color: #999; font-size: 12px; text-transform: uppercase; margin-bottom: 10px;">Bilans</div>
                <div style="font-size: 28px; font-weight: 600; color: var(--color-primary);">${bilansCount}</div>
            </div>
            <div style="background: white; padding: 20px; border-radius: 8px; border-left: 4px solid var(--color-accent);">
                <div style="color: #999; font-size: 12px; text-transform: uppercase; margin-bottom: 10px;">Formations</div>
                <div style="font-size: 28px; font-weight: 600; color: var(--color-primary);">${formationsCount}</div>
            </div>
            <div style="background: white; padding: 20px; border-radius: 8px; border-left: 4px solid var(--color-accent);">
                <div style="color: #999; font-size: 12px; text-transform: uppercase; margin-bottom: 10px;">Animations</div>
                <div style="font-size: 28px; font-weight: 600; color: var(--color-primary);">${animationsCount}</div>
            </div>
            <div style="background: white; padding: 20px; border-radius: 8px; border-left: 4px solid #F37322;">
                <div style="color: #999; font-size: 12px; text-transform: uppercase; margin-bottom: 10px;">En Cours</div>
                <div style="font-size: 28px; font-weight: 600; color: #0F4761;">${encours}</div>
            </div>
            <div style="background: white; padding: 20px; border-radius: 8px; border-left: 4px solid #F37322;">
                <div style="color: #999; font-size: 12px; text-transform: uppercase; margin-bottom: 10px;">Facturé</div>
                <div style="font-size: 28px; font-weight: 600; color: #0F4761;">${facture}</div>
            </div>
        </div>
    `;
    document.getElementById('dashboardContent').innerHTML = html;
}

function getStatutClass(statut) {
    const classes = {
        'Prospect': 'statut-prospect',
        'En cours': 'statut-encours',
        'Facturé': 'statut-facture',
        'Payé': 'statut-paye',
        'Terminé': 'statut-termine'
    };
    return classes[statut] || 'statut-prospect';
}

function getDocuments(type) {
    const docs = {
        'bilans': ['Contrat de sous-traitance', 'FORM 03-F', 'FORM 16', 'Offre', 'Dates', 'Synthèse'],
        'formations': ['Diagnostic', 'Fiche Navette', 'Programme', 'Convention', 'Convocation', 'Feuille d\'émargement', 'Attestation', 'Facture', 'Facture acquitté'],
        'animations': ['Devis', 'Convention', 'Rapport', 'Attestation', 'Facture'],
        'seminaires': ['Devis', 'Convention', 'Rapport', 'Attestation', 'Facture']
    };
    return docs[type] || [];
}

function getContactEmails(record) {
    const emails = [];
    if (record.email) emails.push(record.email);
    if (record.email2) emails.push(record.email2);
    return emails.filter(e => e && e.includes('@')).join(',');
}

function sendEmail(record) {
    const emails = getContactEmails(record);
    if (!emails) {
        alert('Aucun email valide trouvé');
        return;
    }
    const subject = 'EL-ÉNERGIE - ' + record.clientName;
    const mailtoLink = 'mailto:' + emails + '?cc=el.energie@orange.fr&subject=' + encodeURIComponent(subject);
    window.location.href = mailtoLink;
}

function cycleDocStatus(type, clientId, docName) {
    const record = data[type].find(r => r.id === clientId);
    if (!record) return;
    
    if (!record.documents) record.documents = {};
    const states = ['À générer', 'Généré', 'Envoyé', 'Signé'];
    const current = record.documents[docName] || 'À générer';
    const idx = states.indexOf(current);
    const nextState = states[(idx + 1) % states.length];
    record.documents[docName] = nextState;
    
    // Si "À générer" → "Généré", déclencher génération
    if (current === 'À générer' && nextState === 'Généré') {
        generateDocFromCRM(record, docName);
    }
    
    saveData();
    renderTable(type);
}

function generateDocFromCRM(client, docName) {
    console.log("=== DEBUT generateDocFromCRM ===");
    console.log("docName:", docName);
    console.log("client:", client);
    
    // Préparer les données
    const clientData = {
        clientName: client.clientName,
        entreprise: client.entreprise || '',
        email: client.email || '',
        telephone: client.telephone || '',
        contact2: client.contact2 || '',
        email2: client.email2 || '',
        telephone2: client.telephone2 || '',
        montantTTC: client.montantTTC || 0,
        prestationType: client.prestationType || '',
        type: client.type || '',
        dateDebut: new Date().toLocaleDateString('fr-FR'),
        dateFin: new Date(Date.now() + 30*24*60*60*1000).toLocaleDateString('fr-FR')
    };
    
    console.log("clientData préparées:", clientData);
    
    // Déterminer le type de doc exact avec noms des fichiers
    const docTypeMap = {
        'Convention': client.type === 'bilan' ? 'BILAN_01_Convention_EL-ENERGIE_VIERGE.docx' : 'FORMATION_01_Convention_VIERGE.docx',
        'Contrat de sous-traitance': 'Contrat_de_sous_traitance_FINAL.docx',
        'FORM 03-F': 'BILAN_02_FORM03F_Guide_orientation_VIERGE.docx',
        'FORM 16': 'BILAN_04_FORM16_Emargement_Avancement_VIERGE.xlsx',
        'Offre': 'BILAN_03_Offre_commerciale_VIERGE.docx',
        'Émargement': 'BILAN_04_FORM16_Emargement_Avancement_VIERGE.xlsx',
        'Programme': 'FORMATION_02_Programme_VIERGE.docx',
        'Diagnostic': 'FORMATION_03_Diagnostic_VIERGE.docx',
        'Certificat': 'FORMATION_04_Certificat_VIERGE.docx',
        'Attestation': 'FORMATION_04_Certificat_VIERGE.docx',
        'Synthèse': 'BILAN_01_Convention_EL-ENERGIE_VIERGE.docx',
        'Fiche Navette': 'FORMATION_Fiche_Navette_VIERGE.docx',
        'Convocation': 'FORMATION_Convocation_VIERGE.docx',
        'Feuille d\'émargement': 'FORMATION_Feuille_Emargement_VIERGE.xlsx',
        'Facture': 'FORMATION_Facture_VIERGE.docx',
        'Facture acquitté': 'FORMATION_Facture_Acquitte_VIERGE.docx'
    };
    
    const docType = docTypeMap[docName];
    console.log("docType mappé:", docType);
    
    if (!docType) {
        console.error("ERREUR: Type de document inconnu:", docName);
        alert(`⚠️ Type de document inconnu: ${docName}`);
        return;
    }
    
    // Appeler Google Apps Script via fetch
    const scriptUrl = "https://script.google.com/macros/s/AKfycbzqHxc7iB0Gnl3MSELawyDblINqZZAChLEDG3YwOPhCUZ8yDKnecvcqB9QowqiEaMgJ/exec";
    
    console.log("scriptUrl:", scriptUrl);
    console.log("Envoi du POST avec données:", { clientData, docType });
    
    if (scriptUrl) {
        fetch(scriptUrl, {
            method: 'POST',
            body: JSON.stringify({ clientData, docType })
        })
        .then(response => {
            console.log("Réponse reçue - status:", response.status);
            console.log("Réponse headers:", response.headers);
            return response.json();
        })
        .then(data => {
            console.log("JSON parsé:", data);
            if (data.success) {
                console.log("✓ Succès - URL:", data.document.fileUrl);
                alert(`✓ ${docName} généré!\nLien: ${data.document.fileUrl}`);
            } else {
                console.error("❌ Erreur serveur:", data.error);
                alert(`❌ Erreur: ${data.error}`);
            }
        })
        .catch(err => {
            console.error('❌ ERREUR FETCH:', err);
            console.error('Stack:', err.stack);
            alert('❌ Erreur de connexion au générateur');
        });
    } else {
        console.error("ERREUR: Générateur non configuré");
        alert('⚠️ Générateur non configuré.');
    }
}

function getDocStatusColor(status) {
    const colors = {
        'À générer': '#9e9e9e',
        'Généré': '#4caf50',
        'Envoyé': '#2196f3',
        'Signé': '#f37322'
    };
    return colors[status] || '#9e9e9e';
}

function renderTable(type) {
    const records = data[type];
    const container = document.getElementById(type + 'Table');
    const docs = getDocuments(type);
    
    // Filtrer par utilisateur
    const userRecords = records.filter(r => !r.utilisateur || r.utilisateur === currentUser);
    
    if (!userRecords.length) {
        container.innerHTML = '<p>Aucune donnée</p>';
        return;
    }
    
    let html = '<table style="overflow-x: auto;"><tr>';
    
    // En-têtes différents selon le type
    if (type === 'formations') {
        html += '<th>Entreprise</th><th>Nom du Client</th><th>Type de prestation</th><th>Montant HT</th><th>Montant TTC</th><th>Responsable</th><th>Statut</th>';
        docs.forEach(doc => {
            html += '<th style="font-size: 11px; max-width: 80px;">' + doc + '</th>';
        });
    } else {
        html += '<th>Client</th><th>Entreprise</th><th>Type</th><th>Montant</th><th>Responsable</th><th>Statut</th>';
        docs.forEach(doc => {
            html += '<th style="font-size: 11px; max-width: 80px;">' + doc + '</th>';
        });
        html += '<th>Email</th>';
    }
    
    html += '<th>Actions</th></tr>';
    
    userRecords.forEach(r => {
        html += '<tr>';
        
        if (type === 'formations') {
            // Colonnes pour formations dans l'ordre exact demandé
            html += '<td>' + (r.entreprise || '—') + '</td>';
            html += '<td>' + r.clientName + '</td>';
            html += '<td>' + (r.prestationType || '') + '</td>';
            html += '<td style="text-align: right;">' + (r.montantTTC ? Math.round(r.montantTTC * 0.8) : 0) + '€</td>';
            html += '<td style="text-align: right;">' + r.montantTTC + '€</td>';
            html += '<td><span style="display: inline-block; background: ' + (r.utilisateur === 'Edwige' ? '#F37322' : '#8b5a8e') + '; color: white; padding: 4px 8px; border-radius: 2px; font-size: 11px; font-weight: 600;">' + (r.utilisateur || 'Edwige') + '</span></td>';
            html += '<td><span class="statut-badge ' + getStatutClass(r.statut) + '">' + r.statut + '</span></td>';
            
            // Docs formations
            docs.forEach(doc => {
                const status = (r.documents && r.documents[doc]) || 'À générer';
                const bgColor = getDocStatusColor(status);
                html += '<td style="text-align: center;">';
                html += '<button onclick="cycleDocStatus(\'' + type + '\', ' + r.id + ', \'' + doc + '\')" style="background: ' + bgColor + '; color: white; border: none; padding: 6px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: 600; min-width: 70px;">' + status + '</button>';
                html += '</td>';
            });
        } else {
            // Colonnes pour autres types
            html += '<td>' + r.clientName + '</td>';
            html += '<td>' + (r.entreprise || '—') + '</td>';
            html += '<td>' + (r.prestationType || '') + '</td>';
            html += '<td>' + r.montantTTC + '€</td>';
            html += '<td><span style="display: inline-block; background: ' + (r.utilisateur === 'Edwige' ? '#F37322' : '#8b5a8e') + '; color: white; padding: 4px 8px; border-radius: 2px; font-size: 11px; font-weight: 600;">' + (r.utilisateur || 'Edwige') + '</span></td>';
            html += '<td><span class="statut-badge ' + getStatutClass(r.statut) + '">' + r.statut + '</span></td>';
            
            docs.forEach(doc => {
                const status = (r.documents && r.documents[doc]) || 'À générer';
                const bgColor = getDocStatusColor(status);
                html += '<td style="text-align: center;">';
                html += '<button onclick="cycleDocStatus(\'' + type + '\', ' + r.id + ', \'' + doc + '\')" style="background: ' + bgColor + '; color: white; border: none; padding: 6px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: 600; min-width: 70px;">' + status + '</button>';
                html += '</td>';
            });
            
            html += '<td style="font-size: 11px;">';
            if (r.email) html += r.email + '<br>';
            if (r.email2) html += r.email2;
            html += '<br><button class="btn-edit" onclick="sendEmail(data.' + type + '.find(x => x.id === ' + r.id + '))" style="margin-top: 4px; background: var(--color-primary); color: white; padding: 4px 8px; border: none; border-radius: 3px; cursor: pointer; font-size: 10px; width: 100%;">✉ Envoyer</button>';
            html += '</td>';
        }
        
        html += '<td>';
        html += '<button class="btn-edit" onclick="editRecord(\'' + type + '\', ' + r.id + ')">✎ Modifier</button> ';
        html += '<button class="btn-delete" onclick="deleteRecord(\'' + type + '\', ' + r.id + ')">✕ Supp</button>';
        html += '</td></tr>';
    });
    
    html += '</table>';
    container.innerHTML = html;
}

function showAddClientModal() {
    editingRecord = null;
    editingType = null;
    document.getElementById('modalTitle').innerText = 'Ajouter Client';
    document.getElementById('editClientName').value = '';
    document.getElementById('editEmail').value = '';
    document.getElementById('editTelephone').value = '';
    document.getElementById('editContact2').value = '';
    document.getElementById('editEmail2').value = '';
    document.getElementById('editTelephone2').value = '';
    document.getElementById('editEntreprise').value = '';
    document.getElementById('editPrestationType').value = '';
    document.getElementById('editMontantTTC').value = '';
    document.getElementById('editStatut').value = 'Prospect';
    document.getElementById('editNotes').value = '';
    document.getElementById('editModal').classList.add('active');
}

function editRecord(type, id) {
    editingType = type;
    editingRecord = data[type].find(r => r.id === id);
    
    if (!editingRecord) {
        alert('Erreur : enregistrement non trouvé');
        return;
    }
    
    document.getElementById('modalTitle').innerText = 'Modifier Client';
    document.getElementById('editClientName').value = editingRecord.clientName || '';
    document.getElementById('editEmail').value = editingRecord.email || '';
    document.getElementById('editTelephone').value = editingRecord.telephone || '';
    document.getElementById('editContact2').value = editingRecord.contact2 || '';
    document.getElementById('editEmail2').value = editingRecord.email2 || '';
    document.getElementById('editTelephone2').value = editingRecord.telephone2 || '';
    document.getElementById('editEntreprise').value = editingRecord.entreprise || '';
    document.getElementById('editPrestationType').value = editingRecord.prestationType || '';
    document.getElementById('editMontantTTC').value = editingRecord.montantTTC || 0;
    document.getElementById('editStatut').value = editingRecord.statut || 'Prospect';
    document.getElementById('editNotes').value = editingRecord.notes || '';
    
    document.getElementById('editModal').classList.add('active');
}

function closeModal() {
    document.getElementById('editModal').classList.remove('active');
}

function saveRecord() {
    const name = document.getElementById('editClientName').value.trim();
    const email = document.getElementById('editEmail').value.trim();
    const telephone = document.getElementById('editTelephone').value.trim();
    const contact2 = document.getElementById('editContact2').value.trim();
    const email2 = document.getElementById('editEmail2').value.trim();
    const telephone2 = document.getElementById('editTelephone2').value.trim();
    const entreprise = document.getElementById('editEntreprise').value.trim();
    const prestationType = document.getElementById('editPrestationType').value.trim();
    const montant = parseInt(document.getElementById('editMontantTTC').value) || 0;
    const statut = document.getElementById('editStatut').value;
    const notes = document.getElementById('editNotes').value.trim();
    
    if (!name || !prestationType) {
        alert('Nom et Type sont obligatoires');
        return;
    }
    
    if (editingRecord) {
        editingRecord.clientName = name;
        editingRecord.email = email;
        editingRecord.telephone = telephone;
        editingRecord.contact2 = contact2;
        editingRecord.email2 = email2;
        editingRecord.telephone2 = telephone2;
        editingRecord.entreprise = entreprise;
        editingRecord.prestationType = prestationType;
        editingRecord.montantTTC = montant;
        editingRecord.statut = statut;
        editingRecord.notes = notes;
        renderTable(editingType);
    } else {
        const guessType = prestationType.toLowerCase().includes('bilan') ? 'bilans' : 
                         prestationType.toLowerCase().includes('animation') ? 'animations' : 'formations';
        const newId = Math.max(...data[guessType].map(r => r.id), 0) + 1;
        data[guessType].push({
            id: newId,
            clientName: name,
            email: email,
            telephone: telephone,
            contact2: contact2,
            email2: email2,
            telephone2: telephone2,
            entreprise: entreprise,
            prestationType: prestationType,
            montantTTC: montant,
            statut: statut,
            notes: notes,
            type: guessType,
            documents: {},
            utilisateur: currentUser
        });
        renderTable(guessType);
    }
    
    saveData();
    closeModal();
    renderDashboard();
}

function deleteRecord(type, id) {
    if (confirm('Supprimer ?')) {
        data[type] = data[type].filter(r => r.id !== id);
        renderTable(type);
        saveData();
        renderDashboard();
    }
}

function exportData() {
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'CRM_data_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
}

function triggerImport() {
    document.getElementById('importFile').click();
}

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            data = imported;
            saveData();
            alert('✓ Données importées');
            renderDashboard();
            renderTable('bilans');
        } catch (err) {
            alert('Erreur : fichier JSON invalide');
        }
    };
    reader.readAsText(file);
}

// Init
document.addEventListener('DOMContentLoaded', () => {
    loadData();
    applyUserColors();
    renderDashboard();
    renderTable('bilans');
    renderTable('formations');
    renderTable('animations');
    renderTable('seminaires');
});
</script>
