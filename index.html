<script>

const getStatutClass = (statut) => {
    const s = statut.toLowerCase();
    if (s.includes('prospect')) return 'statut-prospect';
    if (s.includes('cours')) return 'statut-encours';
    if (s.includes('factur')) return 'statut-facture';
    if (s.includes('pay')) return 'statut-paye';
    if (s.includes('termin')) return 'statut-termine';
    return 'statut-prospect';
};

const getDocuments = (type) => {
    return type === 'formations' ? 
        ['Diagnostic', 'Participants', 'Fiche Navette', 'Programme', 'Convention', 'Convocation', 'Feuille d\'émargement', 'Attestation', 'Facture', 'Facture acquitté'] :
        ['Convention', 'Offre', 'FORM 03-F', 'Synthèse', 'Émargement'];
};

const getDocStatusColor = (status) => {
    if (!status || status === 'À générer') return '#ccc';
    if (status === 'Généré') return '#4caf50';
    if (status === 'Envoyé') return '#2196f3';
    if (status === 'Signé') return '#ff9800';
    return '#ccc';
};

function switchView(view) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(view).classList.add('active');
    event.target.classList.add('active');
    renderTable(view);
}

function switchUser() {
    currentUser = document.getElementById('userSelector').value;
    applyUserColors();
    renderTable('bilans');
    renderTable('formations');
    renderTable('animations');
    renderTable('seminaires');
    renderDashboard();
}

function applyUserColors() {
    if (currentUser === 'Florence') {
        document.body.classList.add('florence-mode');
    } else {
        document.body.classList.remove('florence-mode');
    }
}

function saveData() {
    localStorage.setItem('el-energie-crm-data', JSON.stringify(data));
}

function loadData() {
    const saved = localStorage.getItem('el-energie-crm-data');
    if (saved) data = JSON.parse(saved);

const docTemplateMap = {
    'Diagnostic': '1nce_ZaplWutY-RhllB_Eso96GOgN5D5hujVPpy3Emkk',
    'Participants': '',
    'Fiche Navette': '195s8Sg-7T8UrmCqyIhGMiM2lB-hzI4asf9sqy8b4Yqs',
    'Programme': '1D7LGlrJ0aFANmhw_0jQ8y5japxJVOs55ZbIm4RRm8Xs',
    'Convention': '1-gvct63yaMLfYcBIj4QZ4OUJ5lzW2S871vxpa8zpEGM',
    'Convocation': '',
    'Feuille d\'émargement': '',
    'Attestation': '',
    'Facture': '',
    'Facture acquitté': ''
};

function generateDoc(type, clientId, docName) {
    const record = data[type].find(r => r.id === clientId);
    if (!record) return;

    const templateId = docTemplateMap[docName];
    if (!templateId) {
        alert(`⚠️ Template non configuré pour ${docName}`);
        return;
    }

    const scriptUrl = "https://script.google.com/macros/s/AKfycbzjBLfEbV4qh5w81_sxyOIh1PAFqBOfB4AEJFxwa_Z0NeDz1a_6ozMCK9HtAvvjpzU/exec";

    const clientData = {
        clientName: record.clientName,
        formateur: currentUser,
        email: record.email,
        telephone: record.telephone,
        SIRET: record.SIRET || '',
        entreprise: record.entreprise,
        adressePostale: record.adressePostale || '',
        prestationType: record.prestationType,
        OPCO: record.OPCO || '',
        montantTTC: record.montantTTC,
        contact2: record.contact2 || '',
        email2: record.email2 || '',
        telephone2: record.telephone2 || '',
        quantiteParticipants: record.quantiteParticipants || ''
    };

    fetch(scriptUrl, {
        method: 'POST',
        body: JSON.stringify({ clientData, docName, templateId })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            console.log('✓ Doc générée:', data.document.fileUrl);
            alert(`✓ ${docName} généré!`);
        } else {
            console.error('❌ Erreur:', data.error);
            alert(`❌ Erreur: ${data.error}`);
        }
    })
    .catch(err => {
        console.error('❌ ERREUR FETCH:', err);
        alert('❌ Erreur de connexion');
    });
}

function cycleDocStatus(type, clientId, docName) {
    const record = data[type].find(r => r.id === clientId);
    if (!record) return;

    if (!record.documents) record.documents = {};
    
    const states = ['À générer', 'Généré', 'Envoyé', 'Signé'];
    const current = record.documents[docName] || 'À générer';
    const idx = states.indexOf(current);
    
    // Si déjà "Signé", ne pas continuer (arrêt du cyclage)
    if (current === 'Signé') {
        return;
    }
    
    const nextState = states[(idx + 1) % states.length];
    
    // Si on passe à "Généré", appeler le script
    if (nextState === 'Généré' && current === 'À générer') {
        generateDoc(type, clientId, docName);
    }
    
    record.documents[docName] = nextState;
    saveData();
    renderTable(type);
}

function renderTable(type) {
    const records = data[type];
    const container = document.getElementById(type + 'Table');
    const docs = getDocuments(type);
    
    const userRecords = records.filter(r => !r.utilisateur || r.utilisateur === currentUser);
    
    if (!userRecords.length) {
        container.innerHTML = '<p>Aucune donnée</p>';
        return;
    }
    
    let html = '<table style="overflow-x: auto;"><tr>';
    
    if (type === 'formations') {
        html += '<th>Entreprise</th><th>Nom du Client</th><th>Type de prestation</th><th>Montant HT</th><th>Montant TTC</th><th>Responsable</th><th>Statut</th>';
        docs.forEach(doc => {
            html += '<th style="font-size: 11px; max-width: 80px;">' + doc + '</th>';
        });
    } else {
        html += '<th>Client</th><th>Entreprise</th><th>Type</th><th>Montant</th><th>Responsable</th><th>Statut</th>';
        docs.forEach(doc => {
            html += '<th style="font-size: 11px; max-width: 80px;">' + doc + '</th>';
        });
        html += '<th>Email</th>';
    }
    
    html += '<th>Actions</th></tr>';
    
    userRecords.forEach(r => {
        html += '<tr>';
        
        if (type === 'formations') {
            html += '<td>' + (r.entreprise || '—') + '</td>';
            html += '<td>' + r.clientName + '</td>';
            html += '<td>' + (r.prestationType || '') + '</td>';
            html += '<td style="text-align: right;">' + (r.montantTTC ? Math.round(r.montantTTC * 0.8) : 0) + '€</td>';
            html += '<td style="text-align: right;">' + r.montantTTC + '€</td>';
            html += '<td><span style="display: inline-block; background: ' + (r.utilisateur === 'Edwige' ? '#F37322' : '#8b5a8e') + '; color: white; padding: 4px 8px; border-radius: 2px; font-size: 11px; font-weight: 600;">' + (r.utilisateur || 'Edwige') + '</span></td>';
            html += '<td><span class="statut-badge ' + getStatutClass(r.statut) + '">' + r.statut + '</span></td>';
            
            docs.forEach(doc => {
                if (doc === 'Participants') {
                    // Afficher la liste des participants avec bouton Ajouter
                    const participants = data.participants ? data.participants.filter(p => p.clientId === r.id) : [];
                    html += '<td style="font-size: 11px;">';
                    if (participants.length > 0) {
                        participants.forEach((p, idx) => {
                            if (idx > 0) html += '<br>';
                            html += p.name + ' (' + p.email + ')';
                        });
                        html += '<br><button class="btn-doc" onclick="showParticipantsTableModal(' + r.id + ')" style="margin-top: 5px; background: #4CAF50; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: 600;">+ Ajouter</button>';
                    } else {
                        html += '<button class="btn-doc" onclick="showParticipantsTableModal(' + r.id + ')" style="background: #4CAF50; color: white; border: none; padding: 6px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: 600;">+ Ajouter</button>';
                    }
                    html += '</td>';
                } else {
                    // Afficher le bouton document
                    const status = (r.documents && r.documents[doc]) || 'À générer';
                    const bgColor = getDocStatusColor(status);
                    html += '<td style="text-align: center;">';
                    html += '<button class="btn-doc" onclick="cycleDocStatus(\'' + type + '\', ' + r.id + ', \'' + doc + '\')" style="background: ' + bgColor + '; color: white; border: none; padding: 6px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: 600; min-width: 70px;">' + status + '</button>';
                    html += '</td>';
                }
            });
        } else {
            html += '<td>' + r.clientName + '</td>';
            html += '<td>' + (r.entreprise || '—') + '</td>';
            html += '<td>' + (r.prestationType || '') + '</td>';
            html += '<td>' + r.montantTTC + '€</td>';
            html += '<td><span style="display: inline-block; background: ' + (r.utilisateur === 'Edwige' ? '#F37322' : '#8b5a8e') + '; color: white; padding: 4px 8px; border-radius: 2px; font-size: 11px; font-weight: 600;">' + (r.utilisateur || 'Edwige') + '</span></td>';
            html += '<td><span class="statut-badge ' + getStatutClass(r.statut) + '">' + r.statut + '</span></td>';
            
            docs.forEach(doc => {
                const status = (r.documents && r.documents[doc]) || 'À générer';
                const bgColor = getDocStatusColor(status);
                html += '<td style="text-align: center;">';
                html += '<button class="btn-doc" onclick="cycleDocStatus(\'' + type + '\', ' + r.id + ', \'' + doc + '\')" style="background: ' + bgColor + '; color: white; border: none; padding: 6px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: 600; min-width: 70px;">' + status + '</button>';
                html += '</td>';
            });
            
            html += '<td style="font-size: 11px;">';
            if (r.email) html += r.email + '<br>';
            if (r.email2) html += r.email2;
            html += '</td>';
        }
        
        html += '<td>';
        html += '<button class="btn-edit" onclick="editRecord(\'' + type + '\', ' + r.id + ')">✎</button> ';
        html += '<button class="btn-delete" onclick="deleteRecord(\'' + type + '\', ' + r.id + ')">✕</button>';
        html += '</td></tr>';
    });
    
    html += '</table>';
    container.innerHTML = html;
}

function toggleExtraFields() {
    const prestationType = document.getElementById('editPrestationType').value.toLowerCase();
    const isFormation = prestationType.includes('formation') || prestationType.includes('bilan') === false;
    const siretGroup = document.getElementById('siretGroup');
    const adresseGroup = document.getElementById('adresseGroup');
    const opcoGroup = document.getElementById('opcoGroup');
    
    if (isFormation) {
        siretGroup.style.display = 'block';
        adresseGroup.style.display = 'block';
        opcoGroup.style.display = 'block';
    } else {
        siretGroup.style.display = 'none';
        adresseGroup.style.display = 'none';
        opcoGroup.style.display = 'none';
    }
}

function showAddClientModal() {
    editingRecord = null;
    editingType = null;
    document.getElementById('modalTitle').innerText = 'Ajouter Client';
    document.getElementById('editClientName').value = '';
    document.getElementById('editSIRET').value = '';
    document.getElementById('editEmail').value = '';
    document.getElementById('editTelephone').value = '';
    document.getElementById('editContact2').value = '';
    document.getElementById('editEmail2').value = '';
    document.getElementById('editTelephone2').value = '';
    document.getElementById('editEntreprise').value = '';
    document.getElementById('editAdressePostale').value = '';
    document.getElementById('editPrestationType').value = '';
    document.getElementById('editOPCO').value = '';
    document.getElementById('editMontantTTC').value = '';
    document.getElementById('editStatut').value = 'Prospect';
    document.getElementById('editNotes').value = '';
    document.getElementById('editQuantiteParticipants').value = '';
    toggleExtraFields();
    document.getElementById('editModal').classList.add('active');
}

function editRecord(type, id) {
    editingType = type;
    editingRecord = data[type].find(r => r.id === id);
    
    if (!editingRecord) {
        alert('Erreur : enregistrement non trouvé');
        return;
    }
    
    document.getElementById('modalTitle').innerText = 'Modifier Client';
    document.getElementById('editClientName').value = editingRecord.clientName || '';
    document.getElementById('editSIRET').value = editingRecord.SIRET || '';
    document.getElementById('editEmail').value = editingRecord.email || '';
    document.getElementById('editTelephone').value = editingRecord.telephone || '';
    document.getElementById('editContact2').value = editingRecord.contact2 || '';
    document.getElementById('editEmail2').value = editingRecord.email2 || '';
    document.getElementById('editTelephone2').value = editingRecord.telephone2 || '';
    document.getElementById('editEntreprise').value = editingRecord.entreprise || '';
    document.getElementById('editAdressePostale').value = editingRecord.adressePostale || '';
    document.getElementById('editPrestationType').value = editingRecord.prestationType || '';
    document.getElementById('editOPCO').value = editingRecord.OPCO || '';
    document.getElementById('editMontantTTC').value = editingRecord.montantTTC || 0;
    document.getElementById('editStatut').value = editingRecord.statut || 'Prospect';
    document.getElementById('editNotes').value = editingRecord.notes || '';
    document.getElementById('editQuantiteParticipants').value = editingRecord.quantiteParticipants || '';
    
    toggleExtraFields();
    document.getElementById('editModal').classList.add('active');
}

function closeModal() {
    document.getElementById('editModal').classList.remove('active');
}

let currentParticipantClientId = null;

function showParticipantsTableModal(clientId) {
    currentParticipantClientId = clientId;
    
    // Récupérer les participants existants pour ce client
    const existingParticipants = data.participants ? data.participants.filter(p => p.clientId === clientId) : [];
    
    // Générer 12 lignes
    let html = '';
    for (let i = 0; i < 12; i++) {
        const existing = existingParticipants[i] || { name: '', email: '' };
        html += `<tr>
            <td style="padding: 8px; border: 1px solid #ddd;"><input type="text" id="participant_name_${i}" value="${existing.name}" style="width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 3px;"></td>
            <td style="padding: 8px; border: 1px solid #ddd;"><input type="email" id="participant_email_${i}" value="${existing.email}" style="width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 3px;"></td>
        </tr>`;
    }
    
    document.getElementById('participantsTableBody').innerHTML = html;
    document.getElementById('participantsTableModal').style.display = 'flex';
}

function closeParticipantsTableModal() {
    document.getElementById('participantsTableModal').style.display = 'none';
    currentParticipantClientId = null;
}

function saveAllParticipants() {
    if (!data.participants) {
        data.participants = [];
    }
    
    // Supprimer les anciens participants pour ce client
    data.participants = data.participants.filter(p => p.clientId !== currentParticipantClientId);
    
    // Ajouter les nouveaux participants
    for (let i = 0; i < 12; i++) {
        const name = document.getElementById(`participant_name_${i}`).value.trim();
        const email = document.getElementById(`participant_email_${i}`).value.trim();
        
        if (name && email) {
            data.participants.push({
                id: 'participant_' + currentParticipantClientId + '_' + i,
                clientId: currentParticipantClientId,
                name: name,
                email: email
            });
        }
    }
    
    saveData();
    renderTable('formations');
    closeParticipantsTableModal();
}

function saveRecord() {
    const name = document.getElementById('editClientName').value.trim();
    const SIRET = document.getElementById('editSIRET').value.trim();
    const email = document.getElementById('editEmail').value.trim();
    const telephone = document.getElementById('editTelephone').value.trim();
    const contact2 = document.getElementById('editContact2').value.trim();
    const email2 = document.getElementById('editEmail2').value.trim();
    const telephone2 = document.getElementById('editTelephone2').value.trim();
    const entreprise = document.getElementById('editEntreprise').value.trim();
    const adressePostale = document.getElementById('editAdressePostale').value.trim();
    const prestationType = document.getElementById('editPrestationType').value.trim();
    const OPCO = document.getElementById('editOPCO').value.trim();
    const montant = parseInt(document.getElementById('editMontantTTC').value) || 0;
    const statut = document.getElementById('editStatut').value;
    const notes = document.getElementById('editNotes').value.trim();
    const quantiteParticipants = document.getElementById('editQuantiteParticipants').value.trim();
    
    if (!name || !prestationType) {
        alert('Nom et Type sont obligatoires');
        return;
    }
    
    if (editingRecord) {
        editingRecord.clientName = name;
        editingRecord.SIRET = SIRET;
        editingRecord.email = email;
        editingRecord.telephone = telephone;
        editingRecord.contact2 = contact2;
        editingRecord.email2 = email2;
        editingRecord.telephone2 = telephone2;
        editingRecord.entreprise = entreprise;
        editingRecord.adressePostale = adressePostale;
        editingRecord.prestationType = prestationType;
        editingRecord.OPCO = OPCO;
        editingRecord.montantTTC = montant;
        editingRecord.statut = statut;
        editingRecord.notes = notes;
        editingRecord.quantiteParticipants = quantiteParticipants;
        renderTable(editingType);
    } else {
        const guessType = prestationType.toLowerCase().includes('bilan') ? 'bilans' : 
                         prestationType.toLowerCase().includes('animation') ? 'animations' : 'formations';
        const newId = Math.max(...data[guessType].map(r => r.id), 0) + 1;
        data[guessType].push({
            id: newId,
            clientName: name,
            SIRET: SIRET,
            email: email,
            telephone: telephone,
            contact2: contact2,
            email2: email2,
            telephone2: telephone2,
            entreprise: entreprise,
            adressePostale: adressePostale,
            prestationType: prestationType,
            OPCO: OPCO,
            montantTTC: montant,
            statut: statut,
            notes: notes,
            quantiteParticipants: quantiteParticipants,
            type: guessType,
            documents: {},
            utilisateur: currentUser
        });
        renderTable(guessType);
    }
    
    saveData();
    closeModal();
    renderDashboard();
}

function deleteRecord(type, id) {
    if (confirm('Supprimer ?')) {
        data[type] = data[type].filter(r => r.id !== id);
        renderTable(type);
        saveData();
        renderDashboard();
    }
}

function exportData() {
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'CRM_data_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
}

function triggerImport() {
    document.getElementById('importFile').click();
}

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            data = imported;
            saveData();
            alert('✓ Données importées');
            renderDashboard();
            renderTable('bilans');
        } catch (err) {
            alert('Erreur : fichier JSON invalide');
        }
    };
    reader.readAsText(file);
}

// Init
document.addEventListener('DOMContentLoaded', () => {
    loadData();
    applyUserColors();
    renderDashboard();
    renderTable('bilans');
    renderTable('formations');
    renderTable('animations');
    renderTable('seminaires');
    
    // Listener pour afficher/masquer champs extras
    document.getElementById('editPrestationType').addEventListener('change', toggleExtraFields);
    document.getElementById('editPrestationType').addEventListener('input', toggleExtraFields);
});
</script>
