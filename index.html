<!DOCTYPE html>
<html lang="fr">
<head>

    <style>
        input[type="email"]::-webkit-calendar-picker-indicator {
            display: none;
        }
        input[type="email"] {
            background-image: none;
        }
        /* Enlever spinners des champs number */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Helvetica, Arial; background: #f5f5f5; }
        
        :root {
            --color-primary: #0F4761;
            --color-accent: #F37322;
        }
        
        body.florence-mode {
            --color-primary: #8b5a8e;
            --color-accent: #d4a5d4;
        }
        
        .container { display: flex; height: 100vh; }
        .sidebar { width: 250px; background: var(--color-primary); color: white; padding: 20px; overflow-y: auto; }
        .sidebar h1 { font-size: 16px; margin-bottom: 30px; }
        .sidebar h2 { margin: 20px 0 10px; font-size: 12px; text-transform: uppercase; color: #aaa; }
        .sidebar button { width: 100%; padding: 10px; margin: 5px 0; background: white; color: var(--color-primary); border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .sidebar button.active { background: var(--color-accent); }
        .main { flex: 1; display: flex; flex-direction: column; }
        .header { background: var(--color-primary); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; }
        .header-actions button { background: var(--color-accent); color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px; font-weight: 600; font-size: 12px; }
        .header-actions select { background: var(--color-accent); color: white; padding: 8px 12px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; }
        .content { flex: 1; overflow: auto; padding: 20px; }
        .view { display: none; }
        .view.active { display: block; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; font-size: 12px; }
        th { background: var(--color-primary); color: white; padding: 12px; text-align: left; font-size: 12px; font-weight: 600; }
        td { padding: 12px; border-bottom: 1px solid #ddd; font-size: 12px; }
        tr:hover { background: #f9f9f9; }
        .btn-edit { background: var(--color-accent); color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; }
        .btn-delete { background: #d32f2f; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; margin-left: 5px; }
        .btn-doc { background: #ccc; color: white; padding: 4px 8px; border: none; border-radius: 3px; cursor: pointer; font-size: 10px; font-weight: 600; min-width: 60px; }
        .btn-doc.genere { background: #4caf50; }
        .btn-doc.envoye { background: #2196f3; }
        .btn-doc.signe { background: #ff9800; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-content h2 { color: var(--color-primary); margin-bottom: 20px; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--color-primary); font-size: 13px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; font-family: Helvetica, Arial; }
        .modal-footer { margin-top: 20px; text-align: right; }
        .modal-footer button { padding: 10px 20px; margin-left: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .button-cancel { background: #ccc; color: #333; }
        .button-save { background: var(--color-accent); color: white; }
        h2 { color: var(--color-primary); margin-bottom: 15px; font-size: 18px; }
        .statut-badge { display: inline-block; padding: 4px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
        .statut-prospect { background: #e8f4f8; color: var(--color-primary); }
        .statut-encours { background: #fff3e0; color: var(--color-accent); }
        .statut-facture { background: #e8f5e9; color: #2e7d32; }
        .statut-paye { background: #f3e5f5; color: #6a1b9a; }
        .statut-termine { background: #e0f2f1; color: #00695c; }

</head>

    if (s.includes('factur')) return 'statut-facture';

function switchView(view) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(view).classList.add('active');
    event.target.classList.add('active');
    renderTable(view);
}

function switchUser() {
    currentUser = document.getElementById('userSelector').value;
    applyUserColors();
    renderTable('bilans');
    renderTable('formations');
    renderTable('animations');
    renderTable('seminaires');
    renderDashboard();
}

function applyUserColors() {
    if (currentUser === 'Florence') {
        document.body.classList.add('florence-mode');
    } else {
        document.body.classList.remove('florence-mode');
    }
}

function saveData() {
    localStorage.setItem('el-energie-crm-data-v2', JSON.stringify(data));
}

function loadData() {
    const saved = localStorage.getItem('el-energie-crm-data-v2');
    if (saved) data = JSON.parse(saved);
}

function renderDashboard() {
    let bilans = data.bilans.filter(b => b.utilisateur === currentUser);
    let formations = data.formations.filter(f => f.utilisateur === currentUser);
    let animations = data.animations.filter(a => a.utilisateur === currentUser);
    let seminaires = data.seminaires.filter(s => s.utilisateur === currentUser);
    
    let totalBilans = bilans.reduce((sum, b) => sum + b.montantTTC, 0);
    let totalFormations = formations.reduce((sum, f) => sum + f.montantTTC, 0);
    let totalAnimations = animations.reduce((sum, a) => sum + a.montantTTC, 0);

            <div style="background: white; padding: 20px; border-radius: 4px; text-align: center;">

            </div>
            <div style="background: white; padding: 20px; border-radius: 4px; text-align: center;">

                <div style="font-size: 14px; font-weight: 600; color: var(--color-accent); margin-top: 10px;">€</div>
            </div>

function generateDoc(type, clientId, docName) {
    const record = data[type].find(r => r.id === clientId);
    if (!record) return;

    const templateId = docTemplateMap[docName];
    if (!templateId) {
        alert(`⚠️ Template non configuré pour ${docName}`);
        return;
    }

    const scriptUrl = "https://script.google.com/macros/s/AKfycbxq2RfH_rX7MoAoxfI0U9tEw4klIAUaXJ-NV_xJGmNlG0hKZnxTbtaQ74S_cvgSV275/exec";

    const clientData = {
        clientName: record.clientName,
        formatateur: currentUser,
        email: record.email,
        telephone: record.telephone,
        SIRET: record.SIRET || '',
        numeroTVA: record.numeroTVA || '',
        entreprise: record.entreprise,
        adressePostale: record.adressePostale || '',
        prestationType: record.prestationType,
        OPCO: record.OPCO || '',
        montantTTC: record.montantTTC,
        montantHT: record.montantHT || 0,
        dateDebut: record.dateDebut || '',
        dateFin: record.dateFin || '',
        contact2: record.contact2 || '',
        email2: record.email2 || '',
        telephone2: record.telephone2 || '',
        quantiteParticipants: record.quantiteParticipants || '',
        listeStagiaires: getParticipantsOnly(clientId)
    };

    fetch(scriptUrl, {
        method: 'POST',
        body: JSON.stringify({ clientData, docName, templateId })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            console.log('✓ Doc générée:', data.fileUrl);
            alert(`✓ ${docName} généré!`);
        } else {
            console.error('❌ Erreur:', data.error);
            alert(`❌ Erreur: ${data.error}`);
        }
    })
    .catch(err => {
        console.error('❌ ERREUR FETCH:', err);
        alert('❌ Erreur de connexion');
    });
}

function cycleDocStatus(type, clientId, docName) {
    const record = data[type].find(r => r.id === clientId);
    if (!record) return;

    if (!record.documents) record.documents = {};
    
    const states = ['À générer', 'Généré', 'Envoyé', 'Signé'];
    const current = record.documents[docName] || 'À générer';
    const idx = states.indexOf(current);
    
    // Si déjà "Signé", ne pas continuer (arrêt du cyclage)
    if (current === 'Signé') {
        return;
    }
    
    const nextState = states[(idx + 1) % states.length];
    
    // Si on passe à "Généré", appeler le script
    if (nextState === 'Généré' && current === 'À générer') {
        generateDoc(type, clientId, docName);
    }
    
    record.documents[docName] = nextState;
    saveData();
    renderTable(type);
}

function saveRecord() {
    const name = document.getElementById('editClientName').value.trim();

    const numeroTVA = document.getElementById('editNumeroTVA').value.trim();
    const email = document.getElementById('editEmail').value.trim();

    if (!name || !prestationType) {
        alert('Nom et Type sont obligatoires');

    }
    
    if (editingRecord) {
        editingRecord.clientName = name;
        editingRecord.SIRET = SIRET;
        editingRecord.numeroTVA = numeroTVA;
        editingRecord.email = email;
        editingRecord.telephone = telephone;
        editingRecord.contact2 = contact2;
        editingRecord.email2 = email2;
        editingRecord.telephone2 = telephone2;
        editingRecord.entreprise = entreprise;
        editingRecord.adressePostale = adressePostale;
        editingRecord.prestationType = prestationType;
        editingRecord.OPCO = OPCO;
        editingRecord.montantTTC = montant;
        editingRecord.montantHT = montantHT;
        editingRecord.dateDebut = dateDebut;
        editingRecord.dateFin = dateFin;
        editingRecord.statut = statut;
        editingRecord.notes = notes;
        editingRecord.quantiteParticipants = quantiteParticipants;
        renderTable(editingType);
    } else {
        const guessType = prestationType.toLowerCase().includes('bilan') ? 'bilans' : 
                         prestationType.toLowerCase().includes('animation') ? 'animations' : 'formations';
        const newId = Math.max(...data[guessType].map(r => r.id), 0) + 1;
        data[guessType].push({
            id: newId,
            clientName: name,
            SIRET: SIRET,
            numeroTVA: numeroTVA,
            email: email,
            telephone: telephone,
            contact2: contact2,

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            data = imported;
            saveData();
            alert('✓ Données importées');
            renderDashboard();
            renderTable('bilans');
        } catch (err) {
            alert('Erreur : fichier JSON invalide');
        }
    };
    reader.readAsText(file);
}

    saveData();

    // Envoyer au script pour générer la Fiche Client
    const templateId = docTemplateMap['Fiche Client'];
    if (!templateId) {
        alert('⚠️ Template Fiche Client non configuré');
        closeFicheClientModal();
        return;
    }

    const scriptUrl = "https://script.google.com/macros/s/AKfycbxq2RfH_rX7MoAoxfI0U9tEw4klIAUaXJ-NV_xJGmNlG0hKZnxTbtaQ74S_cvgSV275/exec";

    const clientData = {
        clientName: record.clientName,
        formatateur: currentUser,
        email: record.email,
        telephone: record.telephone,
        SIRET: record.SIRET || '',
        numeroTVA: record.numeroTVA || '',
        entreprise: record.entreprise,
        adressePostale: record.adressePostale || '',
        prestationType: record.prestationType,
        OPCO: record.OPCO || '',
        montantTTC: record.montantTTC,
        montantHT: record.montantHT || 0,
        dateDebut: record.dateDebut || '',
        dateFin: record.dateFin || '',
        contact2: record.contact2 || '',
        email2: record.email2 || '',
        telephone2: record.telephone2 || '',
        quantiteParticipants: record.quantiteParticipants || '',
        listeStagiaires: getParticipantsOnly(currentFicheClientId)
    };
    
    console.log('📤 DONNÉES ENVOYÉES AU SCRIPT:', clientData);
    console.log('📄 DOC:', 'Fiche Client');
    console.log('🔑 TEMPLATE ID:', templateId);

    fetch(scriptUrl, {
        method: 'POST',
        body: JSON.stringify({ clientData, docName: 'Fiche Client', templateId })
    })
    .then(response => response.json())
    .then(result => {
        console.log('✓ RÉPONSE SCRIPT:', result);
        if (result.success) {
            console.log('✓ Fiche Client générée:', result.fileUrl);
            alert('✓ Fiche Client générée!');
        } else {
            console.error('❌ Erreur:', result.error);
            alert(`❌ Erreur: ${result.error}`);
        }
        closeFicheClientModal();
        renderTable('formations');
    })
    .catch(err => {
        console.error('❌ ERREUR FETCH:', err);
        alert('❌ Erreur de connexion');
        closeFicheClientModal();
    });
}

// Init
document.addEventListener('DOMContentLoaded', () => {
    loadData();
    applyUserColors();
    renderDashboard();
    renderTable('bilans');
    renderTable('formations');
    renderTable('animations');
    renderTable('seminaires');
    
    // Listener pour afficher/masquer champs extras
    document.getElementById('editPrestationType').addEventListener('change', toggleExtraFields);
    document.getElementById('editPrestationType').addEventListener('input', toggleExtraFields);
    
    // Bloquer autocomplete Fiche Client
    const ficheClientInputs = [
        'fcClientName', 'fcEntreprise', 'fcEmail1', 'fcTelephone1', 
        'fcContact2', 'fcEmail2', 'fcTelephone2', 'fcAdressePostale'
    ];
    
    ficheClientInputs.forEach(id => {
        const input = document.getElementById(id);
        if (input) {
            input.addEventListener('focus', () => {
                input.setAttribute('autocomplete', 'off');
            });
            input.addEventListener('click', () => {
                input.setAttribute('autocomplete', 'off');
            });
        }
    });
});
</script>
